[project]
name = "starwatch-scheduler"
version = "0.1.0"
description = "星哨调度与存储服务：只负责任务调度、结果入库和通知"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.162.3",
  "pydantic-settings>=2.7",
  "pymongo>=4.19",
  "starwatch-core",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
starwatch-scheduler = "starwatch_scheduler.main:run"

[tool.uv.sources]
starwatch-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
