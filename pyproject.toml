[project]
name = "starwatch"
version = "0.1.0"
description = "星哨 StarWatch：可自托管的定时监控平台"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend/core", "backend/scheduler", "backend/fetcher"]

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pytest>=8.4",
  "pytest-asyncio>=1.4",
  "ruff>=0.17.4",
  "starwatch-core",
  "starwatch-fetcher",
  "starwatch-scheduler",
]

[tool.uv.sources]
starwatch-core = { workspace = true }
starwatch-fetcher = { workspace = true }
starwatch-scheduler = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["backend/core/src", "backend/scheduler/src", "backend/fetcher/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "D", "N"]
ignore = ["D107", "D203", "D213", "D415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["starwatch_core", "starwatch_scheduler", "starwatch_fetcher"]

[tool.mypy]
python_version = "3.15"
packages = ["starwatch_core", "starwatch_scheduler", "starwatch_fetcher"]
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["parsel.*", "jsonpath_ng.*", "croniter.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
